name: 機能リクエスト
description: 新しい機能を提案する
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景・課題
      description: この機能が必要な背景や解決したい課題を説明してください
      placeholder: 例）現在の検索ではカテゴリ横断の絞り込みができず、目的の記事にたどり着きにくい
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
      description: どのような機能を追加・変更したいかを具体的に記載してください
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 対象領域
      description: この機能が関係する領域を選択してください
      options:
        - フロントエンド
        - バックエンドAPI
        - データベース
        - セマンティック検索
        - Docker・環境構築
        - ドキュメント
        - その他
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: 希望する優先度を選択してください
      options:
        - 高（業務に大きく影響）
        - 中（あると便利）
        - 低（将来的に欲しい）
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した代替案があれば記載してください
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
      description: 参考リンク、モックアップ、スクリーンショット等があれば添付してください
    validations:
      required: false
